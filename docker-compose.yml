services:
  postgres:
    image: postgres:16
    container_name: sql-practice-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sql_practice
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sql_practice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
